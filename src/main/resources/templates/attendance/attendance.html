<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>근태 관리</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
	function openModal(type) {
    	document.getElementById('modalTitle').innerText = type === 'checkIn' ? '출근 등록' : '퇴근 등록';
    	document.getElementById('modalForm').action = type === 'checkIn' ? '/attendance/commute/check_in' : '/attendance/commute/check_out';
    	document.getElementById('modalSubmitButton').innerText = type === 'checkIn' ? '출근하기' : '퇴근하기';

    	let loggedInEmployeeId = document.getElementById('loggedInEmployeeId').value;
        let employeeIdField = document.getElementById('employeeId');

        employeeIdField.value = loggedInEmployeeId; 
        employeeIdField.readOnly = true; 
    	
    	let modal = document.getElementById('modal');
    	modal.classList.remove('hidden'); 
    	modal.style.display = 'flex'; 
	}

	function closeModal() {
    	let modal = document.getElementById('modal');
    	modal.classList.add('hidden'); 
    	modal.style.display = 'none';
	}
	</script>

	<style>
        /* 인쇄할 때 숨길 요소 */
        @media print {
            .no-print {
                display: none !important;
            }
        }
    </style>

    <script>
        function printAttendanceRecords() {
            window.print();
        }
    </script>

	<!-- 로그인된 employeeId를 숨겨진 input 필드에 저장 -->
	<input type="hidden" id="loggedInEmployeeId" th:value="${employeeId}">

	<!-- 모달 창 -->
	<div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    	<div class="bg-white p-6 rounded-lg shadow-lg max-w-md w-full">
        	<h2 id="modalTitle" class="text-xl font-bold mb-4"></h2>
        	<form id="modalForm" method="post" class="space-y-4" onsubmit="return validateCheckInOut();">
            	<div>
                	<label for="employeeId" class="block font-medium">사원 ID</label>
               		<!-- 로그인된 사원의 EmployeeID(Integer) 자동 입력 -->
                	<input type="text" name="employeeId" id="employeeId"
                    	class="border rounded-lg px-4 py-2 w-full bg-gray-200 cursor-not-allowed"
                    	th:value="${employeeId}" readonly>
            	</div>
            	<div class="flex justify-end space-x-4 mt-6">
                	<button type="button" onclick="closeModal()" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600">취소</button>
                	<button id="modalSubmitButton" type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600"></button>
            	</div>
        	</form>
   	 </div>
	</div>
	

</head>
<body class="bg-gray-100">

	 <div class="flex">
        <!-- 사이드바 -->
        <div th:replace="~{layout/sidebar :: sidebar}"></div>
        
        <div class="ml-64 w-full p-8">
            <!-- 메시지 표시 -->
            <p id="message" th:if="${message}" th:text="${message}" class="text-green-500 font-medium mb-6 text-center"></p>
            
            <!-- 필터 버튼 -->
            <div class="flex justify-center space-x-4 mb-6">
                <button sec:authorize="hasRole('EMPLOYEE')" onclick="openModal('checkIn')" class="w-40 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 text-lg no-print">출근</button>
                <button sec:authorize="hasRole('EMPLOYEE')" onclick="openModal('checkOut')" class="w-40 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 text-lg no-print">퇴근</button>
                <a href="/attendance/leave/add" sec:authorize="hasRole('EMPLOYEE')" class="w-40 py-3 bg-red-500 text-white rounded-lg hover:bg-red-600 text-lg flex justify-center items-center no-print">휴가 신청</a>
                <a href="/attendance/leave/list" class="w-40 py-3 bg-gray-500 text-white rounded-lg hover:bg-gray-600 text-lg flex justify-center items-center no-print">휴가 신청 목록</a>
            	<!-- 인쇄 버튼 추가 -->
            	<button onclick="printAttendanceRecords()" class="w-40 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 text-lg no-print">출력하기</button>
            </div>
            
            
            <!-- 검색 필터 -->
			<form method="get" action="/attendance/records" class="grid grid-cols-6 gap-4 mb-6">
   				<input type="text" name="employeeId" id="searchEmployeeId"
        			th:value="${#authorization.expression('hasRole(''EMPLOYEE'')') ? employeeId : ''}"
        			placeholder="사원 ID"
        			class="border rounded-lg px-4 py-2 w-full no-print"
        			th:readonly="${#authorization.expression('hasRole(''EMPLOYEE'')')}">
        		<input type="text" name="name" placeholder="사원 이름" class="border rounded-lg px-4 py-2 w-full no-print"
        			th:readonly="${#authorization.expression('hasRole(''EMPLOYEE'')')}">
                <input type="date" name="startDate" class="border rounded-lg px-4 py-2 w-full no-print">
                <input type="date" name="endDate" class="border rounded-lg px-4 py-2 w-full no-print">
                <select name="status" class="border rounded-lg px-4 py-2 w-full no-print">
                    <option value="">전체</option>
                    <option value="OnTime">정시</option>
                    <option value="Late">지각</option>
                    <option value="Overtime">야근</option>
                </select>
                <button type="submit" class="w-full py-2 bg-blue-500 text-white rounded-lg text-lg no-print">검색</button>
            </form>

            <!-- 근태 기록 테이블 -->
			<div class="overflow-x-auto">
    			<table class="w-full border-collapse border border-gray-200 text-center shadow-lg" id="attendanceTable">
        			<thead>
						<tr class="bg-blue-500 text-white text-lg">
							<th class="border border-gray-300 py-3 px-4">사원 ID</th>
							<th class="border border-gray-300 py-3 px-4">사원 이름</th>
							<th class="border border-gray-300 py-3 px-4">날짜</th>
							<th class="border border-gray-300 py-3 px-4">출근 시간</th>
							<th class="border border-gray-300 py-3 px-4">퇴근 시간</th>
							<th class="border border-gray-300 py-3 px-4">근태 유형</th>
							<th sec:authorize="hasAnyRole('HR', 'ADMIN')"
								class="border border-gray-300 py-3 px-4">수정</th>
						</tr>
					</thead>
        			<tbody id="attendanceBody">
            			<tr th:each="record : ${records}" class="text-gray-700 text-lg">
                			<td class="border border-gray-300 py-3 px-4" th:text="${record.employeeId}"></td>
                			<td class="border border-gray-300 py-3 px-4" th:text="${record.employeeName}"></td>
                			<td class="border border-gray-300 py-3 px-4" th:text="${record.date}"></td>
                			<td class="border border-gray-300 py-3 px-4" th:text="${record.checkInTime}"></td>
                			<td class="border border-gray-300 py-3 px-4" th:text="${record.checkOutTime}"></td>
                			<td class="border border-gray-300 py-3 px-4" th:text="${record.status}"></td>
                			<td sec:authorize="hasAnyRole('HR', 'ADMIN')" class="border border-gray-300 py-3 px-4">
                    			<a th:href="@{/attendance/update/{attendanceId}(attendanceId=${record.attendanceId})}" 
                        			class="text-blue-500 hover:underline">수정</a>
                			</td>
            			</tr>
        			</tbody>
    			</table>
			</div>

			<!-- 페이지네이션 버튼 -->
			<div class="flex justify-center space-x-2 mt-4">
    			<button onclick="prevPage()" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">이전</button>
    			<span id="pageNumber" class="px-4 py-2 bg-white border rounded-lg">1</span>
    			<button onclick="nextPage()" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">다음</button>
			</div>

			<!-- JavaScript (페이징 처리) -->
			<script>
				let currentPage = 1;
				const rowsPerPage = 10;

				function showPage(page) {
					let table = document.getElementById("attendanceTable");
					let rows = table.getElementsByTagName("tbody")[0]
							.getElementsByTagName("tr");

					let totalRows = rows.length;
					let totalPages = Math.ceil(totalRows / rowsPerPage);

					if (page < 1)
						page = 1;
					if (page > totalPages)
						page = totalPages;

					for (let i = 0; i < totalRows; i++) {
						rows[i].style.display = (i >= (page - 1) * rowsPerPage && i < page
								* rowsPerPage) ? "" : "none";
					}

					document.getElementById("pageNumber").innerText = page;
					currentPage = page;
				}

				function prevPage() {
					if (currentPage > 1) {
						showPage(currentPage - 1);
					}
				}

				function nextPage() {
					let table = document.getElementById("attendanceTable");
					let totalRows = table.getElementsByTagName("tbody")[0]
							.getElementsByTagName("tr").length;
					let totalPages = Math.ceil(totalRows / rowsPerPage);

					if (currentPage < totalPages) {
						showPage(currentPage + 1);
					}
				}

				window.onload = function() {
					showPage(1);
				};
			</script>
		</div>
    </div>
</body>
</html>
