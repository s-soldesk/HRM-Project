            transition: all 0.3s ease;

            background-color: #c0392b;
            transform: translateY(-1px);
        }
        /* 인쇄 스타일 */

   		 	}

    		.content {

    <script>
        function openModal(type) {
            document.getElementById('modalTitle').innerText = type === 'checkIn' ? '출근 등록' : '퇴근 등록';
            document.getElementById('modalForm').action = type === 'checkIn' ? '/attendance/commute/check_in' : '/attendance/commute/check_out';
            document.getElementById('modalSubmitButton').innerText = type === 'checkIn' ? '출근하기' : '퇴근하기';

            let loggedInEmployeeId = document.getElementById('loggedInEmployeeId').value;
            let employeeIdField = document.getElementById('employeeId');
            employeeIdField.value = loggedInEmployeeId; 
            employeeIdField.readOnly = true; 
            document.getElementById('modal').style.display = 'block';
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
        function printAttendanceRecords() {
            window.print();
        }
        let currentPage = 1;
        const rowsPerPage = 10;
        function showPage(page) {
            let table = document.getElementById("attendanceTable");
            let rows = table.getElementsByTagName("tbody")[0].getElementsByTagName("tr");
            let totalRows = rows.length;
            let totalPages = Math.ceil(totalRows / rowsPerPage);
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            for (let i = 0; i < totalRows; i++) {
                rows[i].style.display = (i >= (page - 1) * rowsPerPage && i < page * rowsPerPage) ? "" : "none";
            }
            document.getElementById("pageNumber").innerText = `페이지 ${page} / ${totalPages}`;
            currentPage = page;
        }
        function prevPage() {
            if (currentPage > 1) {
                showPage(currentPage - 1);
            }
        }
        function nextPage() {
            let table = document.getElementById("attendanceTable");
            let totalRows = table.getElementsByTagName("tbody")[0].getElementsByTagName("tr").length;
            let totalPages = Math.ceil(totalRows / rowsPerPage);
            if (currentPage < totalPages) {
                showPage(currentPage + 1);
            }
        }
        window.onload = function() {
            showPage(1);
        };
    </script>

    <div class="sidebar no-print" th:replace="~{layout/sidebar :: sidebar}"></div>

    <div class="content">
        <p id="message" th:if="${message}" th:text="${message}" class="text-success text-center"></p>

        <!-- salary.css 레이아웃 컨테이너 -->
        <div class="salary-container">
            <div>
                <th:block th:if="${#authorization.expression('hasAnyRole(''EMPLOYEE'', ''HR'')')}">
                    <button onclick="openModal('checkIn')" class="btn btn-primary no-print">출근</button>
                    <button onclick="openModal('checkOut')" class="btn btn-primary no-print">퇴근</button>
                    <a href="/attendance/leave/add" class="btn btn-danger no-print">휴가 신청</a>
                </th:block>
                <a href="/attendance/leave/list" class="btn btn-secondary no-print">휴가 신청 목록</a>

            <form method="get" action="/attendance/records" class="no-print">

                <input type="date" name="startDate">
                <input type="date" name="endDate">
                <select name="status">
                    <option value="">전체</option>
                    <option value="OnTime">정시</option>
                    <option value="Late">지각</option>
                    <option value="Overtime">야근</option>
                </select>
                <button type="submit" class="btn btn-primary">검색</button>
            </form>

            <!-- 인쇄 시 유일하게 보이는 근태 조회 테이블 -->
            <table class="table" id="attendanceTable">

                    <tr>
                        <th>사원 ID</th>
                        <th>사원 이름</th>
                        <th>날짜</th>
                        <th>출근 시간</th>
                        <th>퇴근 시간</th>
                        <th>근태 유형</th>
                        <th sec:authorize="hasAnyRole('HR', 'ADMIN')" class="no-print">수정</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="record : ${records}">
                        <td th:text="${record.employeeId}"></td>
                        <td th:text="${record.employeeName}"></td>

                        <td th:text="${record.checkInTime}"></td>
                        <td th:text="${record.checkOutTime}"></td>
                        <td>
                            <span th:switch="${record.status}">
                                <span th:case="'OnTime'">정시</span>
                                <span th:case="'Late'">지각</span>
                                <span th:case="'OverTime'">야근</span>
                                <span th:case="'LeaveEarly'">조퇴</span>

                        </td>
                        <td sec:authorize="hasAnyRole('HR', 'ADMIN')" class="no-print">
                            <a th:href="@{/attendance/update/{attendanceId}(attendanceId=${record.attendanceId})}"
                               class="text-blue-500 hover:underline">수정</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- 페이지네이션 (인쇄 시 숨김) -->
            <div class="pagination no-print">
                <button onclick="prevPage()">이전</button>
                <span id="pageNumber"></span>
                <button onclick="nextPage()">다음</button>
            </div>
        </div>
    </div>

    <!-- hidden 필드와 모달 -->
    <input type="hidden" id="loggedInEmployeeId" th:value="${employeeId}">

        <div class="modal-content">

        </div>
    </div>
    
    <!-- 푸터 (인쇄 시 숨김) -->
    <div th:replace="~{layout/footer :: footer}" class="no-print"></div>

		employeeIdField.readOnly = true;

		document.getElementById('modal').style.display = 'block';
	}

	function closeModal() {
		document.getElementById('modal').style.display = 'none';
	}

	function printAttendanceRecords() {
		window.print();
	}

	let currentPage = 1;
	const rowsPerPage = 10;

	function showPage(page) {
		let table = document.getElementById("attendanceTable");
		let rows = table.getElementsByTagName("tbody")[0]
				.getElementsByTagName("tr");

		let totalRows = rows.length;
		let totalPages = Math.ceil(totalRows / rowsPerPage);

		if (page < 1)
			page = 1;
		if (page > totalPages)
			page = totalPages;

		for (let i = 0; i < totalRows; i++) {
			rows[i].style.display = (i >= (page - 1) * rowsPerPage && i < page
					* rowsPerPage) ? "" : "none";
		}

		document.getElementById("pageNumber").innerText = `페이지 ${page} / ${totalPages}`;
		currentPage = page;
	}

	function prevPage() {
		if (currentPage > 1) {
			showPage(currentPage - 1);
		}
	}

	function nextPage() {
		let table = document.getElementById("attendanceTable");
		let totalRows = table.getElementsByTagName("tbody")[0]
				.getElementsByTagName("tr").length;
		let totalPages = Math.ceil(totalRows / rowsPerPage);

		if (currentPage < totalPages) {
			showPage(currentPage + 1);
		}
	}

	window.onload = function() {
		showPage(1);
	};
</script>
