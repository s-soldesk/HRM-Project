<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>휴가 신청</title>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        // 날짜 유효성 검사
        function validateDate() {
            let startDate = document.getElementById("startDate").value;
            let endDate = document.getElementById("endDate").value;

            if (startDate && endDate && startDate > endDate) {
                alert("시작 날짜는 종료 날짜보다 이전이어야 합니다.");
                return false;
            }
            return true;
        }
    </script>
</head>
<body class="bg-gray-100">
    <div class="max-w-4xl mx-auto mt-10 bg-white p-8 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-6">휴가 신청</h1>

        <!-- 메시지 표시 -->
        <p th:if="${message}" th:text="${message}" class="text-green-500 mb-4"></p>

        <!-- 휴가 신청 폼 -->
        <form th:action="@{/attendance/leave/add}" method="post" class="space-y-4" onsubmit="return validateDate();">
            
            <!-- 사원 ID 필드 -->
            <div>
                <label for="employeeId" class="block font-medium">사원 ID</label>
                
                <input type="text" id="employeeId" class="border rounded-lg px-4 py-2 w-full"
                       th:value="${scheduleDto.employeeId}"
                       th:readonly="${#authorization.expression('hasAnyRole(''EMPLOYEE'', ''HR'')')}"
           			   th:classappend="${#authorization.expression('hasAnyRole(''EMPLOYEE'', ''HR'')')} ? 'bg-gray-200 cursor-not-allowed'">
                      
                <!-- Employee가 직접 입력 못하지만 값을 전달해야 하므로 hidden 필드 추가 -->
                <input type="hidden" name="employeeId" th:value="${scheduleDto.employeeId}">
            </div>

            <div>
                <label for="title" class="block font-medium">일정 제목</label>
                <input type="text" name="title" id="title" class="border rounded-lg px-4 py-2 w-full" required>
            </div>

            <div>
                <label for="leaveType" class="block font-medium">휴가 유형</label>
                <select name="leaveType" id="leaveType" class="border rounded-lg px-4 py-2 w-full">
                    <option value="Annual">연차</option>
                    <option value="Sick">병가</option>
                    <option value="Personal">개인 사유</option>
                </select>
            </div>

            <!-- 날짜 입력 -->
            <div>
                <label for="startDate" class="block font-medium">시작 날짜</label>
                <input type="date" name="startDate" id="startDate" class="border rounded-lg px-4 py-2 w-full" required
                       min="" onchange="document.getElementById('endDate').min = this.value;">
            </div>

            <div>
                <label for="endDate" class="block font-medium">종료 날짜</label>
                <input type="date" name="endDate" id="endDate" class="border rounded-lg px-4 py-2 w-full" required>
            </div>

            <div>
                <label for="reason" class="block font-medium">사유</label>
                <textarea name="reason" id="reason" class="border rounded-lg px-4 py-2 w-full"></textarea>
            </div>

            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">휴가 신청</button>
        </form>

        <!-- 메인 페이지로 돌아가기 버튼 -->
        <div class="mt-6">
            <a href="/attendance" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600">메인 페이지로 돌아가기</a>
        </div>
    </div>

    <script>
        // 오늘 날짜로 min 속성 설정 (과거 날짜 선택 방지)
        document.addEventListener("DOMContentLoaded", function() {
            let today = new Date().toISOString().split("T")[0];
            document.getElementById("startDate").setAttribute("min", today);
            document.getElementById("endDate").setAttribute("min", today);
        });
    </script>
</body>
</html>
