<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>휴가 신청</title>
    <meta charset="UTF-8">
    
    <!-- salary.css 로 변경 -->
    <link rel="stylesheet" href="/css/salary.css">

    <!-- leave_add 페이지 전용 추가 스타일 -->
    <style>
        /* attendance.css 에 있던 small-container 스타일 복원 */
        .small-container {
            max-width: 500px;
            margin: 50px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        /* 입력 필드 관련 스타일 */
        .form-group {
            text-align: left;
            margin-bottom: 12px;
        }
        .form-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 95%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 13px;
        }
        .form-group input {
            height: 35px;
        }
        .form-group textarea {
            resize: none;
            height: 80px;
        }
        #leaveType {
            width: 20%;  
        }
        /* 휴가 신청 폼 하단 버튼 정렬 */
        .leave-btn-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        /* 버튼 색상 오버라이드: 텍스트가 잘 보이도록 */
        .btn.btn-primary {
            background-color: #007bff !important;
            color: #ffffff !important;
        }
        .btn.btn-secondary {
            background-color: #6c757d !important;
            color: #ffffff !important;
        }
        .btn.btn-danger {
            background-color: #dc3545 !important;
            color: #ffffff !important;
        }
    </style>

    <script>
        // 날짜 유효성 검사
        function validateDate() {
            let startDate = document.getElementById("startDate").value;
            let endDate = document.getElementById("endDate").value;

            if (startDate && endDate && startDate > endDate) {
                alert("시작 날짜는 종료 날짜보다 이전이어야 합니다.");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>

    <div class="small-container">
        <h1>휴가 신청</h1>

        <!-- 메시지 표시 -->
        <p th:if="${message}" th:text="${message}" style="color: green; font-weight: bold;"></p>

        <!-- 휴가 신청 폼 -->
        <form th:action="@{/attendance/leave/add}" method="post" onsubmit="return validateDate();">
            <!-- 사원 ID 필드 -->
            <div class="form-group">
                <label for="employeeId">사원 ID</label>
                <input type="text" id="employeeId" th:value="${employeeId}" readonly>
                <!-- 직접 입력할 수 없으므로 hidden 필드로 값 전달 -->
                <input type="hidden" name="employeeId" th:value="${employeeId}">
            </div>

            <div class="form-group">
                <label for="title">일정 제목</label>
                <input type="text" name="title" id="title" required>
            </div>

            <div class="form-group">
                <label for="leaveType">휴가 유형</label>
                <select name="leaveType" id="leaveType">
                    <option value="Annual">연차</option>
                    <option value="Sick">병가</option>
                    <option value="Personal">개인 사유</option>
                </select>
            </div>

            <!-- 날짜 입력 -->
            <div class="form-group">
                <label for="startDate">시작 날짜</label>
                <input type="date" name="startDate" id="startDate" required min=""
                       onchange="document.getElementById('endDate').min = this.value;">
            </div>

            <div class="form-group">
                <label for="endDate">종료 날짜</label>
                <input type="date" name="endDate" id="endDate" required>
            </div>

            <div class="form-group">
                <label for="reason">사유</label>
                <textarea name="reason" id="reason"></textarea>
            </div>

            <div class="leave-btn-container">
                <button type="submit" class="btn btn-primary">휴가 신청</button>
                <a href="/attendance" class="btn btn-secondary">돌아가기</a>
            </div>
        </form>
    </div>

    <script>
        // 오늘 날짜로 min 속성 설정 (과거 날짜 선택 방지)
        document.addEventListener("DOMContentLoaded", function() {
            let today = new Date().toISOString().split("T")[0];
            document.getElementById("startDate").setAttribute("min", today);
            document.getElementById("endDate").setAttribute("min", today);
        });
    </script>

</body>
</html>
