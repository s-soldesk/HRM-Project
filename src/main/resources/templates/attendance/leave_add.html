<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>휴가 신청</title>
    <meta charset="UTF-8">

    <!-- 공통 CSS 파일 추가 -->
    <link rel="stylesheet" href="/css/attendance.css">

    <script>
        // 날짜 유효성 검사
        function validateDate() {
            let startDate = document.getElementById("startDate").value;
            let endDate = document.getElementById("endDate").value;

            if (startDate && endDate && startDate > endDate) {
                alert("시작 날짜는 종료 날짜보다 이전이어야 합니다.");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>

    <div class="small-container">
        <h1>휴가 신청</h1>

        <!-- 메시지 표시 -->
        <p th:if="${message}" th:text="${message}" style="color: green; font-weight: bold;"></p>

        <!-- 휴가 신청 폼 -->
        <form th:action="@{/attendance/leave/add}" method="post" onsubmit="return validateDate();">

            <!-- 사원 ID 필드 -->
            <div class="form-group">
                <label for="employeeId">사원 ID</label>
                <input type="text" id="employeeId"
                       th:value="${employeeId}" readonly>

                <!-- Employee가 직접 입력 못하지만 값을 전달해야 하므로 hidden 필드 추가 -->
                <input type="hidden" name="employeeId" th:value="${employeeId}">
            </div>

            <div class="form-group">
                <label for="title">일정 제목</label>
                <input type="text" name="title" id="title" required>
            </div>

            <div class="form-group">
                <label for="leaveType">휴가 유형</label>
                <select name="leaveType" id="leaveType">
                    <option value="Annual">연차</option>
                    <option value="Sick">병가</option>
                    <option value="Personal">개인 사유</option>
                </select>
            </div>

            <!-- 날짜 입력 -->
            <div class="form-group">
                <label for="startDate">시작 날짜</label>
                <input type="date" name="startDate" id="startDate" required min=""
                       onchange="document.getElementById('endDate').min = this.value;">
            </div>

            <div class="form-group">
                <label for="endDate">종료 날짜</label>
                <input type="date" name="endDate" id="endDate" required>
            </div>

            <div class="form-group">
                <label for="reason">사유</label>
                <textarea name="reason" id="reason"></textarea>
            </div>

            <div class="leave-btn-container">
                <button type="submit" class="btn btn-primary">휴가 신청</button>
                <a href="/attendance" class="btn btn-secondary">메인 페이지로 돌아가기</a>
            </div>
        </form>
    </div>

    <script>
        // 오늘 날짜로 min 속성 설정 (과거 날짜 선택 방지)
        document.addEventListener("DOMContentLoaded", function() {
            let today = new Date().toISOString().split("T")[0];
            document.getElementById("startDate").setAttribute("min", today);
            document.getElementById("endDate").setAttribute("min", today);
        });
    </script>

</body>
</html>
