<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>휴가 신청 목록</title>
    <meta charset="UTF-8">

    <!-- salary.css 적용 -->
    <link rel="stylesheet" href="/css/salary.css">

    <!-- leave_list 페이지 전용 추가 스타일 -->
    <style>
        /* leave_list 컨테이너 스타일 (attendance.css 의 leave-list-container 복원) */
        .leave-list-container {
            max-width: 1200px;
            margin: 50px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        /* 테이블 컨테이너 및 테이블 스타일 */
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            margin-top: 20px;
        }
        .table th, .table td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: center;
        }
        .table th {
            background-color: #007bff;
            color: #fff;
        }
        /* 버튼 영역 스타일 */
        .leave-btn-container {
            margin-top: 20px;
            text-align: center;
        }
        /* leave-list-container 내의 btn-danger 버튼 오버라이드 */
    	.leave-list-container .btn.btn-danger {
        	background-color: #dc3545 !important;  /* 원하는 빨간색 */
        	color: #ffffff !important;
        	border: none !important;
    	}
    	/* 필요에 따라 다른 버튼들도 오버라이드 */
    	.leave-list-container .btn.btn-primary {
        	background-color: #007bff !important;
        	color: #ffffff !important;
       	 border: none !important;
    	}
    	.leave-list-container .btn.btn-secondary {
        	background-color: #6c757d !important;
        	color: #ffffff !important;
        	border: none !important;
    	}
    </style>
</head>

<body>

    <div class="leave-list-container">
        <h1>휴가 신청 목록</h1>

        <!-- 메시지 표시 -->
        <p th:if="${message}" th:text="${message}" style="color: green; font-weight: bold;"></p>

        <!-- 휴가 신청 목록 테이블 -->
        <div class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>사원 ID</th>
                        <th>사원 이름</th>
                        <th>제목</th>
                        <th>휴가 유형</th>
                        <th>사유</th>
                        <th>시작일</th>
                        <th>종료일</th>
                        <th sec:authorize="hasAnyRole('HR', 'ADMIN')">승인</th>
                        <th>상태</th>
                        <th>삭제</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="leave : ${leaves}">
                        <td th:text="${leave.employeeId}"></td>
                        <td th:text="${leave.employeeName}"></td>
                        <td th:text="${leave.title}"></td>
                        <td>
                            <span th:switch="${leave.leaveType}">
                                <span th:case="'Annual'">연차</span>
                                <span th:case="'Sick'">병가</span>
                                <span th:case="'Personal'">개인 사유</span>
                            </span>
                        </td>
                        <td th:text="${leave.reason}"></td>
                        <td th:text="${leave.startDate}"></td>
                        <td th:text="${leave.endDate}"></td> 
                        <td sec:authorize="hasAnyRole('HR', 'ADMIN')">
                            <!-- 승인 및 거절 버튼 -->
                            <form method="post" action="/attendance/leave/approve" class="inline-block">
                                <input type="hidden" name="scheduleId" th:value="${leave.scheduleId}">
                                <button type="submit" class="btn btn-primary"
                                        th:disabled="${leave.status == 'CONFIRMED'}">승인</button>
                            </form>
                            <form method="post" action="/attendance/leave/reject" class="inline-block">
                                <input type="hidden" name="scheduleId" th:value="${leave.scheduleId}">
                                <button type="submit" class="btn btn-danger"
                                        th:disabled="${leave.status == 'REJECTED'}">거절</button>
                            </form>
                        </td>
                        <td>
                            <span th:switch="${leave.status}">
                                <span th:case="'CONFIRMED'">승인</span>
                                <span th:case="'PENDING'">보류</span>
                                <span th:case="'REJECTED'">거절</span>
                            </span>
                        </td>
                        <td>
                            <form th:if="${leave.status == 'PENDING' or #authorization.expression('hasAnyRole(''HR'', ''ADMIN'')')}" 
                                  th:action="@{/attendance/leave/delete/{scheduleId}(scheduleId=${leave.scheduleId})}" method="post">
                                <button type="submit" class="btn btn-danger"
                                        onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 메인 페이지로 돌아가기 버튼 -->
        <div class="leave-btn-container">
            <a href="/attendance" class="btn btn-secondary">돌아가기</a>
        </div>
    </div>

</body>
</html>
