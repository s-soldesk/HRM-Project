<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>근태 기록 수정</title>
    <meta charset="UTF-8">
    
    <!-- salary.css 적용 -->
    <link rel="stylesheet" href="/css/salary.css">
    
    <!-- update 페이지 전용 추가 스타일 -->
    <style>
        /* attendance-edit-container 스타일 복원 */
        .attendance-edit-container {
            max-width: 500px;
            margin: 50px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: left;
        }
        /* 사원 정보 영역 스타일 */
        .info-container {
            margin-bottom: 20px;
        }
        /* 입력 필드 그룹 스타일 */
        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }
        .form-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
        }
        .form-group input,
        .form-group select {
            width: 95%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 13px;
        }
        #status {
            width: 20%;  
        }
        /* 버튼 영역 스타일 */
        .button-container {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        /* 버튼 색상 오버라이드: 텍스트가 잘 보이도록 */
        .btn.btn-primary {
            background-color: #007bff !important;
            color: #ffffff !important;
        }
        .btn.btn-secondary {
            background-color: #6c757d !important;
            color: #ffffff !important;
        }
        .btn.btn-danger {
            background-color: #dc3545 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body>

    <div class="attendance-edit-container">
        <h1>근태 기록 수정</h1>

        <!-- 사원 정보 출력 -->
        <div class="info-container">
            <p><strong>사원 ID:</strong> <span th:text="${attendance.employeeId}"></span></p>
            <p><strong>사원 이름:</strong> <span th:text="${attendance.employeeName}"></span></p>
        </div>

        <!-- 근태 수정 폼 -->
        <form method="post" action="/attendance/update">
            <input type="hidden" name="attendanceId" th:value="${attendance.attendanceId}">
            <input type="hidden" name="employeeId" th:value="${attendance.employeeId}">
            <input type="hidden" name="date" th:value="${attendance.date}">

            <div class="form-group">
                <label for="checkInTime">출근 시간</label>
                <input type="time" name="checkInTime" id="checkInTime" th:value="${attendance.checkInTime}">
            </div>

            <div class="form-group">
                <label for="checkOutTime">퇴근 시간</label>
                <input type="time" name="checkOutTime" id="checkOutTime" th:value="${attendance.checkOutTime}">
            </div>

            <div class="form-group">
                <label for="status">근태 유형</label>
                <select name="status" id="status">
                    <option value="OnTime" th:selected="${attendance.status == 'OnTime'}">정시</option>
                    <option value="Late" th:selected="${attendance.status == 'Late'}">지각</option>
                    <option value="LeaveEarly" th:selected="${attendance.status == 'LeaveEarly'}">조퇴</option>
                    <option value="OverTime" th:selected="${attendance.status == 'OverTime'}">야근</option>     
                </select>
            </div>

            <div class="button-container">
                <button type="submit" class="btn btn-primary">수정</button>
                <a href="/attendance" class="btn btn-secondary">돌아가기</a>
            </div>
        </form>
    </div>

</body>
</html>
