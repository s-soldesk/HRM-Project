<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>근태 기록 수정</title>
    <meta charset="UTF-8">

    <!-- 공통 CSS 파일 추가 -->
    <link rel="stylesheet" href="/css/attendance.css">
</head>
<body>

    <div class="attendance-edit-container">
        <h1>근태 기록 수정</h1>

        <!-- 사원 정보 출력 -->
        <div class="info-container">
            <p><strong>사원 ID:</strong> <span th:text="${attendance.employeeId}"></span></p>
            <p><strong>사원 이름:</strong> <span th:text="${attendance.employeeName}"></span></p>
        </div>

        <!-- 근태 수정 폼 -->
        <form method="post" action="/attendance/update">
            <input type="hidden" name="attendanceId" th:value="${attendance.attendanceId}">
            <input type="hidden" name="employeeId" th:value="${attendance.employeeId}">
            <input type="hidden" name="date" th:value="${attendance.date}">

            <div class="form-group">
                <label for="checkInTime">출근 시간</label>
                <input type="time" name="checkInTime" id="checkInTime" th:value="${attendance.checkInTime}">
            </div>

            <div class="form-group">
                <label for="checkOutTime">퇴근 시간</label>
                <input type="time" name="checkOutTime" id="checkOutTime" th:value="${attendance.checkOutTime}">
            </div>

            <div class="form-group">
                <label for="status">근태 유형</label>
                <select name="status" id="status">
                    <option value="OnTime" th:selected="${attendance.status == 'OnTime'}">정시</option>
                    <option value="Late" th:selected="${attendance.status == 'Late'}">지각</option>
                    <option value="Overtime" th:selected="${attendance.status == 'Overtime'}">야근</option>
                </select>
            </div>

            <div class="button-container">
                <button type="submit" class="btn btn-primary">수정</button>
                <a href="/attendance" class="btn btn-secondary">돌아가기</a>
            </div>
        </form>
    </div>

</body>
</html>
