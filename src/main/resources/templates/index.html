<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/ko.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <!-- 사이드바 -->
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    
    <div class="content">
        <!-- 프로필과 출퇴근 섹션 -->
        <div class="profile-section">
            <div class="profile-card">
                <img th:if="${employee != null and employee.profileImage != null}"
                     th:src="@{'/uploads/' + ${employee.profileImage}}"
                     alt="프로필 이미지" class="profile-image">
                <img th:unless="${employee != null and employee.profileImage != null}"
                     src="/img/basic.jpg" alt="기본 프로필 이미지" class="profile-image">
                <div class="profile-info">
                    <h3 th:text="${employee?.name}">null null</h3>
                </div>
                <div class="attendance-time">
                    <p>출근시간: <span id="checkInTime">--:--</span></p>
                    <p>퇴근시간: <span id="checkOutTime">--:--</span></p>
                </div>
            </div>
        </div>

        <!-- 주요 정보 그리드 -->
        <div class="dashboard-grid">
            <!-- 공지사항 요약 -->
            <div class="section-box notice-section">
                <div class="section-header">
                    <h3>공지사항</h3>
                    <a href="/notices" class="more-btn">more</a>
                </div>
                <ul class="notice-list" th:if="${not #lists.isEmpty(recentNotices)}">
                    <li th:each="notice : ${recentNotices}">
                        <a th:href="@{/notices/{id}(id=${notice.noticeId})}">
                            <span class="notice-title" th:text="${notice.title}">공지1</span>
                            <span class="notice-date" th:text="${#temporals.format(notice.createdDate, 'yyyy-MM-dd')}">2025-02-20</span>
                        </a>
                    </li>
                </ul>
                <p class="empty-message" th:if="${#lists.isEmpty(recentNotices)}">현재 작성된 글이 없습니다.</p>
            </div>

            <!-- 채용 게시판 요약 -->
            <div class="section-box recruitment-section">
                <div class="section-header">
                    <h3>채용 게시판</h3>
                    <a href="/recruitments" class="more-btn">more</a>
                </div>
                <ul class="recruitment-list" th:if="${not #lists.isEmpty(recentRecruitments)}">
                    <li th:each="post : ${recentRecruitments}">
                        <a th:href="@{/recruitments/{id}(id=${post.id})}">
                            <span class="recruitment-title" th:text="${post.title}">채용 공고 제목</span>
                            <span class="recruitment-date" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}">2025-02-20</span>
                        </a>
                    </li>
                </ul>
                <p class="empty-message" th:if="${#lists.isEmpty(recentRecruitments)}">현재 작성된 글이 없습니다.</p>
            </div>

            <!-- 캘린더 요약 -->
            <div class="section-box calendar-section">
                <div class="section-header">
                    <h3>캘린더</h3>
                    <a href="/schedule" class="more-btn">more</a>
                </div>
                <div id="mini-calendar"></div>
            </div>
        </div>
    </div>

    <script src="/js/dashboard.js"></script>
    <!-- Footer Include -->
    <div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
