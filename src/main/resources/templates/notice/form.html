<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>공지사항 작성/수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/dashboard.css}">
    <style>
        :root {
            --primary-color: #2C3E50;
            --secondary-color: #34495E;
            --bg-light: #f8f9fa;
            --border-color: #ECF0F1;
        }

        .content {
            margin-left: 270px;
            padding: 2rem;
            width: calc(100% - 270px);
            background-color: var(--bg-light);
            min-height: 100vh;
        }

        .notice-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .page-title {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--primary-color);
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(44, 62, 80, 0.25);
            outline: none;
        }

        .form-group textarea {
            height: 300px;
            resize: vertical;
        }

        .form-group input[type="file"] {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            color : white;
        }

        .btn-submit {
            background-color: #2C3E50;
        }

        .btn-cancel {
            background-color: #2C3E50;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            opacity: 0.9;
            color: white;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .content {
                margin-left: 0;
                width: 100%;
                padding: 1rem;
            }

            .notice-container {
                padding: 1rem;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>

    <div class="content">
        <div class="notice-container">
            <h2 class="page-title" th:text="${notice != null ? '공지사항 수정' : '공지사항 작성'}"></h2>

            <form th:action="${notice != null ? '/notices/' + notice.noticeId : '/notices'}"
                  method="post"
                  enctype="multipart/form-data">
                <div class="form-group">
                    <label>제목</label>
                    <input type="text" name="title" th:value="${notice != null ? notice.title : ''}" required>
                </div>

                <div class="form-group">
                    <label>내용</label>
                    <textarea name="content" required th:text="${notice != null ? notice.content : ''}"></textarea>
                </div>

                <div class="form-group">
                    <label>첨부파일</label>
                    <input type="file" name="file" accept=".jpg,.jpeg,.png,.gif,.pdf,.doc,.docx">
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary" th:text="${notice != null ? '수정' : '작성'}"></button>
                    <a href="/notices" class="btn btn-primary">취소</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
