<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>공지사항 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/dashboard.css}">
    <style>
        :root {
            --primary-color: #2C3E50;
            --secondary-color: #34495E;
            --bg-light: #f8f9fa;
            --border-color: #ECF0F1;
        }

        .content {
            margin-left: 270px;
            padding: 2rem;
            width: calc(100% - 270px);
            background-color: var(--bg-light);
            min-height: 100vh;
        }

        .notice-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .notice-header {
            background-color: var(--bg-light);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        .notice-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .notice-meta {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            color: var(--secondary-color);
            font-size: 0.9rem;
        }

        .divider {
            color: var(--border-color);
        }

        .notice-content {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            min-height: 300px;
            border: 1px solid var(--border-color);
            line-height: 1.6;
            color: #333;
            margin-bottom: 2rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .button-group {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            min-width: 100px;
            text-align: center;
            text-decoration: none;
        }

        .btn-list {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-modify {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            opacity: 0.9;
            color: white;
        }

        @media (max-width: 768px) {
            .content {
                margin-left: 0;
                width: 100%;
                padding: 1rem;
            }

            .notice-container {
                padding: 1rem;
            }

            .notice-meta {
                flex-direction: column;
                gap: 0.5rem;
            }

            .divider {
                display: none;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div th:replace="~{layout/sidebar :: sidebar}"></div>

    <div class="content">
        <div class="notice-container">
            <div class="notice-header">
                <div class="notice-title" th:text="${notice.title}"></div>
                <div class="notice-meta">
                    <span>작성자: <span th:text="${notice.authorName}"></span></span>
                    <span class="divider">|</span>
                    <span>작성일: <span th:text="${#temporals.format(notice.createdDate, 'yyyy-MM-dd HH:mm:ss')}"></span></span>
                    <span class="divider">|</span>
                    <span>조회수: <span th:text="${notice.readCount}"></span></span>
                </div>
            </div>

            <div class="notice-content" th:utext="${notice.content}"></div>

            <div class="button-group">
                <a href="/notices" class="btn btn-primary">목록</a>
                <th:block th:if="${isAdmin}">
                    <a th:href="@{/notices/{id}/edit(id=${notice.noticeId})}" class="btn btn-primary">수정</a>
                    <form th:action="@{/notices/{id}/delete(id=${notice.noticeId})}" method="post">
                        <button type="submit" class="btn btn-primary" 
                                onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
                    </form>
                </th:block>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
