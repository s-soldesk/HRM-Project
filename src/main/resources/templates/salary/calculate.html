<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>급여 계산</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/salary.css}">
    <link rel="stylesheet" href="/css/sidebar.css">

    <script th:inline="javascript">
        function changeMonth() {
            const select = document.getElementById('yearMonth');
            const value = select.value;
            if (value) {
                window.location.href = '/salary/calculate/status/' + value.replace('/', '-');
            }
        }

        function handleButtonClick(button) {
            const employeeId = button.getAttribute('data-employee-id');
            const yearMonth = button.getAttribute('data-year-month');
            if (!employeeId || !yearMonth) {
                alert('데이터가 누락되었습니다.');
                return;
            }
            window.location.href = `/salary/calculate/detail/${employeeId}/${yearMonth}`;
        }
    </script>
</head>
<body>
    <!-- 사이드바 -->
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    
    <div class="content">
        <div class="salary-container">
            <h2 class="mb-4">급여 계산</h2>

            <div class="form-group mb-4">
                <select id="yearMonth" class="form-select w-auto" onchange="changeMonth()">
                    <option value="">귀속 연월 선택</option>
                    <option th:each="month : ${months}" th:value="${month}" th:text="${month}"></option>
                </select>
            </div>

            <div class="card">
                <div class="card-body">
                    <h3 class="card-title mb-4">근태 확인</h3>
                    <div class="mb-3">
                        <p th:if="${selectedMonth != null}" class="text-primary" th:text="'선택한 날짜 : ' + ${selectedMonth}"></p>
                        <p th:if="${selectedMonth == null}" class="text-muted">날짜를 선택해 주세요.</p>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>사원번호</th>
                                    <th>이름</th>
                                    <th>부서</th>
                                    <th>직급</th>
                                    <th>근무일수</th>
                                    <th>총근무시간</th>
                                    <th>연장근무시간</th>
                                    <th>근태 확정</th>
                                    <th>상세보기</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${attendances != null and not #lists.isEmpty(attendances)}"
                                    th:each="attendance : ${attendances}">
                                    <td th:text="${attendance.employeeId}"></td>
                                    <td th:text="${attendance.employeeName}"></td>
                                    <td th:text="${attendance.departmentName}"></td>
                                    <td th:text="${attendance.position?.getPosition() ?: attendance.position}"></td>
                                    <td th:text="${attendance.workingDays} + ' days'"></td>
                                    <td th:text="${attendance.totalWorkedHours} + ' h'"></td>
                                    <td th:text="${attendance.totalOvertimeHours} + ' h'"></td>
                                    <td>
                                        <span th:if="${attendance.salaryStatus == 'CONFIRMED'}" 
                                              class="badge bg-success">✔️ 확정</span>
                                        <span th:unless="${attendance.salaryStatus == 'CONFIRMED'}" 
                                              class="badge bg-warning text-dark">❌ 미확정</span>
                                    </td>
                                    <td>
                                        <button class="btn btn-sm btn-primary"
                                            th:attr="data-employee-id=${attendance.employeeId}, data-year-month=${yearMonth}"
                                            onclick="handleButtonClick(this)">상세보기</button>
                                    </td>
                                </tr>
                                <tr th:if="${attendances == null or #lists.isEmpty(attendances)}">
                                    <td colspan="9" class="text-center text-muted py-4">
                                        해당 월의 근태 데이터가 없습니다.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer Include -->
    <div th:replace="~{layout/footer :: footer}"></div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
