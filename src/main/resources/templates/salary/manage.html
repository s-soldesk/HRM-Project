	<script th:inline="javascript">
        // 직급 매핑 정보
        const positionMapping = {
            '인턴': 'INTERN',
            '사원': 'STAFF',
            '주임': 'SENIOR',
            '대리': 'ASSISTANT_MANAGER',
            '과장': 'MANAGER',
            '차장': 'SENIOR_MANAGER',
            '부장': 'DEPUTY_GENERAL_MANAGER'
        };

        // 검색 처리 함수
        function handleSearch(event) {
            event.preventDefault();
            const form = document.getElementById('searchForm');
            const searchType = form.searchType.value;
            const keyword = form.keyword.value.trim();

            if (searchType === 'position') {
                const englishPosition = positionMapping[keyword];
                if (englishPosition) {
                    form.keyword.value = englishPosition;
                } else {
                    alert('올바른 직급명을 입력해주세요.\n(인턴, 사원, 주임, 대리, 과장, 차장, 부장)');
                    return;
                }
            }

            form.submit();
        }

        // 페이지 로드 시 이벤트 리스너 등록
        document.addEventListener('DOMContentLoaded', function() {
            const searchForm = document.getElementById('searchForm');
            searchForm.addEventListener('submit', handleSearch);

            // 직급 검색 시 placeholder 변경
            const searchType = document.querySelector('select[name="searchType"]');
            const searchInput = document.querySelector('input[name="keyword"]');
            
            searchType.addEventListener('change', function() {
                if (this.value === 'position') {
                    searchInput.placeholder = '직급명을 입력하세요 (예: 과장, 대리)';
                } else {
                    searchInput.placeholder = '검색어를 입력하세요';
                }
            });
        });
    </script>
    
</head>
<body>
    <!-- 사이드바 -->
    <div th:replace="~{layout/sidebar :: sidebar}"></div>
    
    <div class="content">
        <div class="salary-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">급여 조회</h2>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <form id="searchForm" method="get" th:action="@{/salary/manage}" 
                          class="row g-3 align-items-center">
                        <div class="col-auto">
                            <select name="searchType" class="form-select">
                                <option value="">검색 조건 선택</option>
                                <option value="employeeId">사원번호</option>
                                <option value="name">이름</option>
                                <option value="position">직급</option>
                            </select>
                        </div>
                        <div class="col">
                            <input type="text" name="keyword" class="form-control" 
                                   placeholder="검색어를 입력하세요">
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-primary">검색</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>귀속월</th>
                                    <th>사원번호</th>
                                    <th>사원명</th>
                                    <th class="text-end">지급총액</th>
                                    <th class="text-end">공제총액</th>
                                    <th class="text-end">실지급액</th>
                                    <th class="text-center">상세</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="salary : ${salaries}">
                                    <td th:text="${#temporals.format(salary.paymentDate, 'yyyy-MM-dd')}"></td>
                                    <td th:text="${salary.employeeId}"></td>
                                    <td th:text="${salary.employee.name}"></td>
                                    <td class="text-end" 
                                        th:text="${#numbers.formatInteger(salary.totalSalary, 0, 'COMMA')} + '원'"></td>
                                    <td class="text-end text-danger" 
                                        th:text="${#numbers.formatInteger(salary.deductionTotal, 0, 'COMMA')} + '원'"></td>
                                    <td class="text-end text-success" 
                                        th:text="${#numbers.formatInteger(salary.netPay, 0, 'COMMA')} + '원'"></td>
                                    <td class="text-center">
                                        <button class="btn btn-outline-primary btn-sm" 
                                                th:onclick="'location.href=\'/salary/detail/' + ${salary.salaryId} + '\''">
                                            상세보기
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
	<!-- Footer Include -->
    <div th:replace="~{layout/footer :: footer}"></div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
