<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>급여명세서</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/salary.css}">
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            .content {
                margin: 0 !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body>
    <!-- 사이드바 -->
    <div th:replace="~{layout/sidebar :: sidebar}" class="no-print"></div>
    
    <div class="content">
        <div class="salary-container">
            <h2 class="salary-title" 
                th:text="${#temporals.format(salary.paymentDate, 'yyyy/MM')} + ' 급여명세서'"></h2>

            <!-- 사원 정보 -->
            <div class="card employee-info-card">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <p class="mb-2"><strong>사원번호:</strong> <span th:text="${salary.employeeId}"></span></p>
                            <p class="mb-2"><strong>부서:</strong> <span th:text="${salary.employee.departmentName}"></span></p>
                        </div>
                        <div class="col-md-6">
                            <p class="mb-2"><strong>성명:</strong> <span th:text="${salary.employee.name}"></span></p>
                            <p class="mb-2"><strong>직급:</strong> <span th:text="${salary.employee.position?.getPosition()}"></span></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- 지급내역 -->
                <div class="col-md-6">
                    <div class="card payment-card h-100">
                        <div class="card-header">
                            <h3 class="card-title h5 mb-0">지급내역</h3>
                        </div>
                        <div class="card-body">
                            <div class="amount-row">
                                <span>기본급</span>
                                <span th:text="${#numbers.formatInteger(salary.baseSalary, 0, 'COMMA')} + '원'"></span>
                            </div>
                            <div class="amount-row">
                                <span>식대</span>
                                <span th:text="${#numbers.formatInteger(salary.mealAllowance, 0, 'COMMA')} + '원'"></span>
                            </div>
                            <div class="amount-row">
                                <span>직책수당</span>
                                <span th:text="${#numbers.formatInteger(salary.positionAllowance, 0, 'COMMA')} + '원'"></span>
                            </div>
                            <div class="amount-row">
                                <span>초과 근무수당</span>
                                <span th:text="${#numbers.formatInteger(salary.overtimePay, 0, 'COMMA')} + '원'"></span>
                            </div>
                            <div class="amount-total">
                                <span>지급총액</span>
                                <span th:text="${#numbers.formatInteger(salary.totalSalary, 0, 'COMMA')} + '원'"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 공제내역 -->
                <div class="col-md-6">
                    <div class="card deduction-card h-100">
                        <div class="card-header">
                            <h3 class="card-title h5 mb-0">공제내역</h3>
                        </div>
                        <div class="card-body">
                            <div class="amount-row">
                                <span>국민연금</span>
                                <span th:text="${#numbers.formatInteger(salary.nationalPension, 0, 'COMMA')} + '원'"></span>
                            </div>
                            <div class="amount-row">
                                <span>건강보험</span>
                                <span th:text="${#numbers.formatInteger(salary.healthInsurance, 0, 'COMMA')} + '원'"></span>
                            </div>
                            <div class="amount-row">
                                <span>고용보험</span>
                                <span th:text="${#numbers.formatInteger(salary.employmentInsurance, 0, 'COMMA')} + '원'"></span>
                            </div>
                            <div class="amount-row">
                                <span>장기요양보험</span>
                                <span th:text="${#numbers.formatInteger(salary.longTermCareInsurance, 0, 'COMMA')} + '원'"></span>
                            </div>
                            <div class="amount-row">
                                <span>소득세</span>
                                <span th:text="${#numbers.formatInteger(salary.incomeTax, 0, 'COMMA')} + '원'"></span>
                            </div>
                            <div class="amount-row">
                                <span>지방소득세</span>
                                <span th:text="${#numbers.formatInteger(salary.localIncomeTax, 0, 'COMMA')} + '원'"></span>
                            </div>
                            <div class="amount-total">
                                <span>공제총액</span>
                                <span th:text="${#numbers.formatInteger(salary.deductionTotal, 0, 'COMMA')} + '원'"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 실지급액 -->
            <div class="card net-pay-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <h3 class="h5 mb-0">실지급액</h3>
                        <span class="net-pay-amount" th:text="${#numbers.formatInteger(salary.netPay, 0, 'COMMA')} + '원'"></span>
                    </div>
                </div>
            </div>

            <!-- 버튼 그룹 -->
            <div class="d-flex justify-content-center gap-3 no-print">
                <button onclick="history.back()" class="btn btn-secondary">목록으로</button>
                <button onclick="window.print()" class="btn btn-primary">출력하기</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
